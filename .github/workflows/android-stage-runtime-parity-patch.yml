name: Apply Android stage runtime parity patch

on:
  push:
    branches: ["codex/android-stage-runtime-parity-3.2.1"]
    paths:
      - ".github/workflows/android-stage-runtime-parity-patch.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/android-stage-runtime-parity-3.2.1
          fetch-depth: 0

      - name: Patch Android creation stage runtime
        shell: python
        run: |
          from pathlib import Path

          def replace_between(text: str, start: str, end: str, replacement: str) -> str:
              start_at = text.index(start)
              end_at = text.index(end, start_at)
              return text[:start_at] + replacement.rstrip() + "\n\n" + text[end_at:]

          agent_path = Path("mobile/android/app/src/main/java/com/siming/mobile/data/creation/MobileCreationAgent.kt")
          agent = agent_path.read_text(encoding="utf-8")

          generate_stage = r'''    suspend fun generateStage(
              source: JsonObject,
              stage: String,
              instruction: String,
              config: DirectApiConfig,
          ): JsonObject {
              require(stage in contract.stageOrder && stage != "constraints") { "未知立项阶段" }
              val (system, user) = if (stage == "concepts") {
                  contract.conceptMessages(source, instruction)
              } else {
                  contract.stageMessages(source, stage, baseline(source, stage), instruction)
              }
              val maxTokens = if (stage == "concepts") 3_200 else 6_000
              val temperature = if (stage == "concepts") 0.8 else 0.65
              val creationExtraBody = if (config.isDeepSeek()) buildJsonObject {
                  put("thinking", buildJsonObject { put("type", "disabled") })
              } else null
              val raw = directApi.complete(
                  config,
                  system,
                  user,
                  maxOutputTokens = maxTokens,
                  temperature = temperature,
                  extraBody = creationExtraBody,
              )
              val stageBaseline = baseline(source, stage)
              var sourceLabel = "model"
              var warning = ""
              var repairMethod = ""
              var rawResponsePreview = ""
              val data = try {
                  parseStageData(stage, raw, stageBaseline, source.objectValue("draft"))
              } catch (initialError: Exception) {
                  val (repairSystem, repairUser) = contract.repairMessages(
                      raw,
                      initialError.message.orEmpty(),
                      stage,
                  )
                  val repaired = try {
                      directApi.complete(
                          config,
                          repairSystem,
                          repairUser,
                          maxOutputTokens = maxTokens,
                          temperature = 0.0,
                          extraBody = creationExtraBody,
                      )
                  } catch (error: CancellationException) {
                      throw error
                  } catch (_: Exception) {
                      null
                  }
                  val repairedData = repaired?.let { repairedRaw ->
                      runCatching {
                          parseStageData(stage, repairedRaw, stageBaseline, source.objectValue("draft"))
                      }.getOrNull()
                  }
                  if (repairedData != null) {
                      sourceLabel = "model_repaired"
                      warning = "模型返回的结构已自动修复；请像 PC 端一样先审阅再确认。"
                      repairMethod = "model_json"
                      repairedData
                  } else {
                      sourceLabel = "contract_fallback"
                      warning = "模型回复格式不可用，已保留可编辑安全草稿；请重点检查后再确认。"
                      repairMethod = "safe_partial_draft"
                      rawResponsePreview = raw.take(4_000)
                      safeFallbackData(source, stage, raw)
                  }
              }
              return writeStage(
                  source,
                  stage,
                  data,
                  status = "generated",
                  sourceLabel = sourceLabel,
                  warning = warning,
                  repairMethod = repairMethod,
                  rawResponsePreview = rawResponsePreview,
              )
          }'''
          agent = replace_between(
              agent,
              "    suspend fun generateStage(\n",
              "    private fun parseStageData(\n",
              generate_stage,
          )

          fallback_helpers = r'''    internal fun safeFallbackData(source: JsonObject, stage: String, raw: String): JsonObject {
              require(stage in contract.stageOrder && stage != "constraints") { "未知立项阶段" }
              val draft = source.objectValue("draft")
              val stageBaseline = baseline(source, stage)
              if (stage == "concepts") {
                  safePartialConceptData(raw, draft)?.let { return it }
                  val fallback = normalizeConcepts(buildJsonObject {
                      put("concepts", JsonArray(listOf(safeConceptCard(draft))))
                  })
                  validateStage(stage, fallback)
                  validateAuthorRequirements(stage, fallback, JsonObject(emptyMap()), draft)
                  return fallback
              }
              runCatching {
                  parseStageData(stage, raw, stageBaseline, draft)
              }.getOrNull()?.let { return it }
              validateStage(stage, stageBaseline)
              validateAuthorRequirements(stage, stageBaseline, stageBaseline, draft)
              return stageBaseline
          }

          private fun safePartialConceptData(raw: String, draft: JsonObject): JsonObject? {
              val parsed = MobileCreationJsonRepair.parseObjectDetailed(raw)?.value ?: return null
              val payload = (parsed["data"] as? JsonObject) ?: parsed
              val rows = (payload["concepts"] as? JsonArray)
                  ?: (payload["options"] as? JsonArray)
                  ?: return null
              val sourceCard = rows.firstOrNull() as? JsonObject ?: return null
              val baseCard = safeConceptCard(draft)
              val merged = baseCard.toMutableMap().apply { putAll(sourceCard) }
              val protagonist = baseCard.objectValue("protagonist_seed").toMutableMap().apply {
                  (sourceCard["protagonist_seed"] as? JsonObject)?.let(::putAll)
              }
              merged["protagonist_seed"] = JsonObject(protagonist)
              return try {
                  val data = normalizeConcepts(buildJsonObject {
                      put("concepts", JsonArray(listOf(JsonObject(merged))))
                  })
                  validateStage("concepts", data)
                  validateAuthorRequirements("concepts", data, JsonObject(emptyMap()), draft)
                  data
              } catch (_: Exception) {
                  null
              }
          }

          private fun safeConceptCard(draft: JsonObject): JsonObject {
              val form = draft.objectValue("form")
              val authorBrief = draft.string("author_brief")
              val brief = authorBrief.ifBlank { form.string("brief") }.ifBlank { "待补充故事方案" }
              val requirements = draft.arrayValue("locked_requirements")
                  .map(::stringElement)
                  .filter(String::isNotBlank)
              val lockedSource = buildList {
                  add(brief)
                  addAll(requirements)
              }.joinToString("；")
              val protagonistName = Regex("(?:^|[，。；])\\s*([^，。；]{2,20}?)(?:必须是|必须为|是)")
                  .find(lockedSource)
                  ?.groupValues
                  ?.getOrNull(1)
                  ?.trim()
                  .orEmpty()
                  .ifBlank { "待确认主角" }
              val titleSeed = brief.substringBefore('。').substringBefore('，').take(20).ifBlank { "作者方案" }
              return buildJsonObject {
                  put("title", titleSeed)
                  put("subtitle", "依据作者原始设定整理，可继续编辑")
                  put("logline", brief.take(120))
                  put("protagonist_seed", buildJsonObject {
                      put("name", protagonistName)
                      put("identity", lockedSource.take(500))
                      put("goal", "落实作者方案中的首要目标")
                      put("lack", "待作者确认")
                  })
                  put("world_hook", lockedSource.take(500))
                  put("core_conflict", lockedSource.take(500))
                  put("story_engine", "遵循作者大纲持续推进")
                  put("opening_hook", "从作者指定的起点切入")
                  put("differentiators", strings(requirements.ifEmpty { listOf("保留作者原始设定") }))
                  put("risks", strings(listOf("这是模型格式异常后的安全草稿，请在继续前检查")))
              }
          }'''
          marker = "    fun confirmStage(source: JsonObject, stage: String, editedData: JsonObject? = null): JsonObject {"
          marker_at = agent.index(marker)
          agent = agent[:marker_at] + fallback_helpers.rstrip() + "\n\n" + agent[marker_at:]

          old_signature = '''    private fun writeStage(
              source: JsonObject,
              stage: String,
              data: JsonObject,
              status: String,
              sourceLabel: String,
          ): JsonObject = updateDraft(source) { draft ->'''
          new_signature = '''    private fun writeStage(
              source: JsonObject,
              stage: String,
              data: JsonObject,
              status: String,
              sourceLabel: String,
              warning: String = "",
              repairMethod: String = "",
              rawResponsePreview: String = "",
          ): JsonObject = updateDraft(source) { draft ->'''
          if old_signature not in agent:
              raise RuntimeError("writeStage signature not found")
          agent = agent.replace(old_signature, new_signature, 1)
          old_metadata = '''            put("source", sourceLabel)
                      put("updated_at", Instant.now().toString())'''
          new_metadata = '''            put("source", sourceLabel)
                      if (warning.isNotBlank()) put("warning", warning)
                      if (repairMethod.isNotBlank()) put("repair_method", repairMethod)
                      if (rawResponsePreview.isNotBlank()) put("raw_response_preview", rawResponsePreview.take(4_000))
                      put("updated_at", Instant.now().toString())'''
          if old_metadata not in agent:
              raise RuntimeError("stage metadata block not found")
          agent = agent.replace(old_metadata, new_metadata, 1)

          parse_object = r'''    private fun parseObject(raw: String): JsonObject =
              MobileCreationJsonRepair.parseObjectDetailed(raw)?.value
                  ?: error("模型返回的 JSON 结构无效")'''
          agent = replace_between(
              agent,
              "    private fun parseObject(raw: String): JsonObject {\n",
              "    private fun strings(values: List<String>): JsonArray",
              parse_object,
          )
          agent_path.write_text(agent, encoding="utf-8")

          test_path = Path("mobile/android/app/src/test/java/com/siming/mobile/data/creation/MobileCreationAgentTest.kt")
          test = test_path.read_text(encoding="utf-8")
          test_case = r'''    @Test
              fun malformedConceptSchemaFallsBackToSafeEditableDraft() {
                  val started = agent.start(
                      CreationStartInput(
                          creationMode = "author_led",
                          brief = "林舟在记忆城寻找失踪姐姐。",
                          lockedRequirements = listOf("主角必须叫林舟"),
                      ),
                  )
                  val raw = """{"concepts":[{"title":"记忆城","logline":"林舟寻找姐姐","protagonist_seed":{name, identity, goal, lack},"world_hook":"记忆会被消耗","core_conflict":"救人与保住记忆冲突","opening_hook":"林舟忘了姐姐的脸"}]}"""
                  val fallback = agent.safeFallbackData(started, "concepts", raw)
                  val card = fallback.array("options").first().jsonObject

                  assertTrue(card.string("logline").isNotBlank())
                  assertTrue(card.objectValue("protagonist_seed").string("identity").contains("林舟"))
                  assertTrue(card.array("risks").first().jsonPrimitive.content.contains("安全草稿"))
              }
          '''
          insert_marker = "    private fun conceptData(): JsonObject = buildJsonObject {"
          if insert_marker not in test:
              raise RuntimeError("MobileCreationAgentTest insertion marker not found")
          test = test.replace(insert_marker, test_case.rstrip() + "\n\n" + insert_marker, 1)
          test_path.write_text(test, encoding="utf-8")

          screen_path = Path("mobile/android/app/src/main/java/com/siming/mobile/ui/CreationScreen.kt")
          screen = screen_path.read_text(encoding="utf-8")
          call_old = '''                status = status,
                          data = data,
                          showBody = showBody,'''
          call_new = '''                status = status,
                          data = data,
                          warning = state.string("warning"),
                          showBody = showBody,'''
          if call_old not in screen:
              raise RuntimeError("StageCard call block not found")
          screen = screen.replace(call_old, call_new, 1)
          sig_old = '''    status: String,
              data: JsonObject?,
              showBody: Boolean,'''
          sig_new = '''    status: String,
              data: JsonObject?,
              warning: String,
              showBody: Boolean,'''
          if sig_old not in screen:
              raise RuntimeError("StageCard signature block not found")
          screen = screen.replace(sig_old, sig_new, 1)
          status_old = '''                            "generated" -> "AI 已生成 · 等你审阅"'''
          status_new = '''                            "generated" -> if (warning.isBlank()) "AI 已生成 · 等你审阅" else "已自动恢复 · 请重点审阅"'''
          if status_old not in screen:
              raise RuntimeError("generated status label not found")
          screen = screen.replace(status_old, status_new, 1)
          body_old = '''                Column(Modifier.padding(15.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                              if (data != null) {'''
          body_new = '''                Column(Modifier.padding(15.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                              if (warning.isNotBlank()) {
                                  Surface(
                                      color = Color(0xFFFFF4E5),
                                      shape = RoundedCornerShape(14.dp),
                                      modifier = Modifier.fillMaxWidth(),
                                  ) {
                                      Text(
                                          warning,
                                          color = Color(0xFF7A4B17),
                                          style = MaterialTheme.typography.bodySmall,
                                          modifier = Modifier.padding(12.dp),
                                      )
                                  }
                              }
                              if (data != null) {'''
          if body_old not in screen:
              raise RuntimeError("StageCard body block not found")
          screen = screen.replace(body_old, body_new, 1)
          screen_path.write_text(screen, encoding="utf-8")

          error_path = Path("mobile/android/app/src/main/java/com/siming/mobile/data/UserFacingError.kt")
          error_text = error_path.read_text(encoding="utf-8")
          if "import kotlinx.serialization.SerializationException\n" not in error_text:
              error_text = error_text.replace(
                  "import java.net.UnknownHostException\n",
                  "import java.net.UnknownHostException\nimport kotlinx.serialization.SerializationException\n",
                  1,
              )
          error_text = error_text.replace(
              '''    is IOException -> "网络通信失败，请检查连接后重试"
              else -> message?.takeIf(String::isNotBlank) ?: "操作没有完成，请重试"''',
              '''    is IOException -> "网络通信失败，请检查连接后重试"
              is SerializationException -> "模型返回的数据格式异常，自动修复未完成，请重试或切换模型"
              else -> message?.takeIf(String::isNotBlank)?.let { raw ->
                  if (raw.contains("Unexpected JSON token") || raw.contains("Expected quotation mark")) {
                      "模型返回的数据格式异常，自动修复未完成，请重试或切换模型"
                  } else {
                      raw
                  }
              } ?: "操作没有完成，请重试"''',
              1,
          )
          error_path.write_text(error_text, encoding="utf-8")

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Test, lint, and build APK
        working-directory: mobile/android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Commit verified parity patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/android-stage-runtime-parity-patch.yml
          git add mobile/android/app/src/main/java/com/siming/mobile/data/creation/MobileCreationAgent.kt
          git add mobile/android/app/src/main/java/com/siming/mobile/data/creation/MobileCreationJsonRepair.kt
          git add mobile/android/app/src/main/java/com/siming/mobile/ui/CreationScreen.kt
          git add mobile/android/app/src/main/java/com/siming/mobile/data/UserFacingError.kt
          git add mobile/android/app/src/test/java/com/siming/mobile/data/creation/MobileCreationAgentTest.kt
          git add mobile/android/app/src/test/java/com/siming/mobile/data/creation/MobileCreationJsonRepairTest.kt
          git commit -m "Align Android creation stage reliability with PC"
          git push origin HEAD:codex/android-stage-runtime-parity-3.2.1
