name: Sync mirror to Gitee

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  release:
    types: [published, edited, prereleased, released]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-gitee
  cancel-in-progress: false

env:
  GITEE_OWNER: teangtang13
  GITEE_REPO: siming-ai

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Fetch all GitHub branches and tags
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail

          mirror_dir="${RUNNER_TEMP}/siming-ai-mirror.git"
          rm -rf "$mirror_dir"
          git init --bare "$mirror_dir"
          git -C "$mirror_dir" remote add github "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$mirror_dir" fetch --prune github \
            '+refs/heads/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*'

      - name: Push all branches and tags to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
          GIT_ASKPASS: /bin/false
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail

          mirror_dir="${RUNNER_TEMP}/siming-ai-mirror.git"
          credential_file="${RUNNER_TEMP}/gitee-credentials"
          encoded_token="$(python -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["GITEE_TOKEN"], safe=""))')"
          printf 'https://teangtang13:%s@gitee.com\n' "$encoded_token" > "$credential_file"
          chmod 600 "$credential_file"
          git config --global credential.helper "store --file=$credential_file"
          trap 'rm -f "$credential_file"' EXIT

          git -C "$mirror_dir" remote add gitee "https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"
          git -C "$mirror_dir" config http.version HTTP/1.1
          git -C "$mirror_dir" config http.postBuffer 536870912
          git -C "$mirror_dir" repack -a -d
          git -C "$mirror_dir" push --force --prune gitee \
            'refs/heads/*:refs/heads/*'
          git -C "$mirror_dir" push --force --prune gitee \
            'refs/tags/*:refs/tags/*'

      - name: Check out release sync script
        uses: actions/checkout@v4

      - name: Install release sync dependency
        run: python -m pip install --disable-pip-version-check "requests>=2.32,<3"

      - name: Mirror GitHub Releases and assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: python .github/scripts/sync_gitee_releases.py
