name: Android 3.2.1 Hotfix Replacement

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-3.2.1-hotfix.yml"

permissions:
  contents: write

jobs:
  replace-apk:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SIMING_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SIMING_ANDROID_KEYSTORE_PASSWORD }}
      SIMING_ANDROID_KEY_ALIAS: ${{ secrets.SIMING_ANDROID_KEY_ALIAS }}
      SIMING_ANDROID_KEY_PASSWORD: ${{ secrets.SIMING_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: pwsh
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify hotfix version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $backendVersion = (Select-String -Path backend/app/version.py -Pattern 'APP_VERSION\s*=\s*["'']([^"'']+)' | Select-Object -First 1).Matches.Groups[1].Value
          $androidBuild = Get-Content mobile/android/app/build.gradle.kts -Raw
          $androidVersion = [regex]::Match($androidBuild, 'versionName\s*=\s*"([^"]+)"').Groups[1].Value
          if ($backendVersion -ne "3.2.1" -or $androidVersion -ne "3.2.1") {
            throw "This one-shot workflow may only replace the v3.2.1 Android asset. backend=$backendVersion android=$androidVersion"
          }

      - name: Prepare Android signing key
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.SIMING_ANDROID_KEYSTORE_BASE64 }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64)) { throw "SIMING_ANDROID_KEYSTORE_BASE64 is not configured." }
          $path = Join-Path $env:RUNNER_TEMP "siming-android-release.jks"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "SIMING_ANDROID_KEYSTORE_FILE=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test and lint Android
        shell: pwsh
        working-directory: mobile/android
        run: ./gradlew.bat testDebugUnitTest lintDebug --stacktrace

      - name: Build and verify signed APK
        shell: pwsh
        run: ./scripts/build-android-release.ps1

      - name: Replace v3.2.1 Android release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          gh release view v3.2.1 -R "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) { throw "Release v3.2.1 does not exist." }
          gh release upload v3.2.1 release/Siming.apk release/Siming-apk-sha256.txt -R "${{ github.repository }}" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to replace v3.2.1 Android assets." }

      - name: Verify published replacement
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $published = Join-Path $env:RUNNER_TEMP "published-apk"
          New-Item -ItemType Directory -Force -Path $published | Out-Null
          gh release download v3.2.1 -R "${{ github.repository }}" -p "Siming.apk" -p "Siming-apk-sha256.txt" -D $published --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to download replaced Android assets." }
          ./scripts/verify-android-release.ps1 -ReleaseDir $published -ExpectedVersion 3.2.1

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-3.2.1-hotfix
          path: |
            release/Siming.apk
            release/Siming-apk-sha256.txt
          if-no-files-found: error
