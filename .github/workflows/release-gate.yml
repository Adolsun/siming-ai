name: Release Gate

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/release-gate.yml"
      - "scripts/sign-windows-release.ps1"
      - "scripts/verify-release-assets.ps1"
      - "scripts/publish-github.ps1"
      - "backend/app/version.py"
      - "frontend/package.json"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate, for example v2.7.13
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-smoke:
    if: github.event_name != 'release'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      MOSHU_DISABLE_AUTO_MCP_SETUP: "1"
      SIMING_ENABLE_LOCAL_RUNTIME: "0"
      OPENAI_API_KEY: test-placeholder
      ANTHROPIC_API_KEY: test-placeholder
      ARK_API_KEY: test-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $frontendVersion = (Get-Content frontend/package.json -Raw | ConvertFrom-Json).version
          $backendVersion = (Select-String -Path backend/app/version.py -Pattern 'APP_VERSION\s*=\s*["'']([^"'']+)' | Select-Object -First 1).Matches.Groups[1].Value
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.tag }}"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}"
          } else {
            "v$frontendVersion"
          }
          if ($tag -ne "v$frontendVersion" -or $frontendVersion -ne $backendVersion) {
            throw "Tag $tag must match frontend/backend version ($frontendVersion/$backendVersion)."
          }
          if ("${{ github.ref_type }}" -eq "tag" -or "${{ github.event_name }}" -eq "workflow_dispatch") {
            git fetch --tags --force
            $headCommit = (git rev-parse HEAD).Trim()
            $tagCommit = (git rev-list -n 1 $tag).Trim()
            if (-not $tagCommit -or $headCommit -ne $tagCommit) {
              throw "Release validation must build the exact tag commit. HEAD=$headCommit tag=$tagCommit"
            }
          }

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm run lint
          npm test
          npm run architecture
          npm run duplicates
          npm run build

      - name: Install backend test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate backend
        working-directory: backend
        run: |
          python scripts/run_quality.py
          python -m pytest tests/test_architecture_foundation.py tests/test_config_llm.py tests/test_novel_creation_workspace_v2.py tests/test_packaging_contract.py tests/test_release_packaging_contract.py

      - name: Validate performance baseline
        run: python scripts/run-performance-baseline.py --output .build/performance.json

      - name: Validate generated API types
        working-directory: frontend
        run: npm run api:check

      - name: Build distributable
        shell: cmd
        run: build-exe.bat

      - name: Sign Windows executable when a trusted certificate is configured
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.SIMING_WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.SIMING_WINDOWS_CODESIGN_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PASSWORD)
          if (-not $hasCertificate -and -not $hasPassword) {
            "SIMING_WINDOWS_RELEASE_SIGNED=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Warning "No Windows code-signing certificate is configured. This release will be manual-download-only."
            exit 0
          }
          if ($hasCertificate -ne $hasPassword) {
            throw "Windows signing configuration is incomplete. Configure both certificate and password, or neither."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "siming-windows-codesign.pfx"
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
            $version = (Get-Content frontend/package.json -Raw | ConvertFrom-Json).version
            ./scripts/sign-windows-release.ps1 `
              -ReleaseDir release `
              -CertificatePath $certificatePath `
              -CertificatePassword $env:WINDOWS_CODESIGN_PASSWORD `
              -ExpectedVersion $version
            "SIMING_WINDOWS_RELEASE_SIGNED=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } finally {
            if (Test-Path -LiteralPath $certificatePath) {
              Remove-Item -LiteralPath $certificatePath -Force
            }
          }

      - name: Verify package assets and run smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content frontend/package.json -Raw | ConvertFrom-Json).version
          if ($env:SIMING_WINDOWS_RELEASE_SIGNED -eq "1") {
            ./scripts/verify-release-assets.ps1 -ReleaseDir release -ExpectedVersion $version -RequireTrustedSignature
          } elseif ("${{ github.ref_type }}" -eq "tag" -or "${{ github.event_name }}" -eq "workflow_dispatch") {
            ./scripts/verify-release-assets.ps1 -ReleaseDir release -ExpectedVersion $version -AllowUnsignedManualRelease
          } else {
            ./scripts/verify-release-assets.ps1 -ReleaseDir release -ExpectedVersion $version
          }
          ./scripts/smoke-test-release.ps1 -SkipBuild

      - name: Upload verified release assets
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          path: |
            release/Siming.exe
            release/update.json
            release/sha256.txt
          if-no-files-found: error

      - name: Publish verified GitHub release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content frontend/package.json -Raw | ConvertFrom-Json).version
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v$version" }
          $notesPath = "docs/release-notes-$version.md"
          $assets = @(
            "release/Siming.exe",
            "release/update.json",
            "release/sha256.txt"
          )
          $releaseExists = $false
          gh release view $tag -R "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { $releaseExists = $true }
          if ($releaseExists) {
            gh release upload $tag @assets -R "${{ github.repository }}" --clobber
          } elseif (Test-Path -LiteralPath $notesPath) {
            gh release create $tag @assets -R "${{ github.repository }}" --title "司命 $version" --notes-file $notesPath
          } else {
            gh release create $tag @assets -R "${{ github.repository }}" --title "司命 $version" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publishing failed." }

  verify-published-assets:
    if: github.event_name == 'release'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify published assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.event.release.tag_name }}"
          $version = $tag.TrimStart("v")
          $expectedAssets = @("Siming.exe", "update.json", "sha256.txt")
          $verified = $false
          New-Item -ItemType Directory -Force -Path release | Out-Null
          for ($attempt = 1; $attempt -le 18; $attempt++) {
            $release = gh release view $tag -R "${{ github.repository }}" --json assets | ConvertFrom-Json
            $availableAssets = @($release.assets | ForEach-Object { $_.name })
            $missingAssets = @($expectedAssets | Where-Object { $_ -notin $availableAssets })
            if ($missingAssets.Count -gt 0) {
              Write-Host "Waiting for published assets ($attempt/18): $($missingAssets -join ', ')"
              Start-Sleep -Seconds 10
              continue
            }
            try {
              gh release download $tag -R "${{ github.repository }}" -p "Siming.exe" -p "update.json" -p "sha256.txt" -D release --clobber
              if ($LASTEXITCODE -ne 0) { throw "gh release download failed with exit code $LASTEXITCODE" }
              ./scripts/verify-release-assets.ps1 -ReleaseDir release -ExpectedVersion $version -AllowUnsignedManualRelease
              $verified = $true
              break
            } catch {
              Write-Host "Published asset verification attempt $attempt/18 failed: $($_.Exception.Message)"
              Start-Sleep -Seconds 10
            }
          }
          if (-not $verified) { throw "Published release assets were not available or did not verify after 18 attempts." }
